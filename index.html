<style id="leaflet-css">
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;

.leaflet-grab {

	}

.leaflet-popup-pane,

	}

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);

.leaflet-control-layers-toggle {

	background-image: url(images/marker-icon.png);

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-touch .leaflet-control-attribution,

.leaflet-popup {

	   -moz-transform: rotate(45deg);

.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

/* div icon */

.leaflet-div-icon {
	background: #fff;

	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;

.leaflet-tooltip-bottom:before {

}
.leaflet-tooltip-right {

}
.leaflet-tooltip-left:before,

	margin-left: -12px;
	border-right-color: #fff;

@media print {

		-webkit-print-color-adjust: exact;

<style>
:root{
  /* layout: one phone-width column; one big yardage tile; bottom tab bar (วัดระยะ / ปักจุด / ข้อมูล) */
  --paper:#f1f4ea; --card:#ffffff; --ink:#12271d; --muted:#566a5d; --line:#d2dbc9;
  --accent:#1b7a49; --on-accent:#ffffff; --tint:#e2edd9;
  --good:#1b7a49; --warn:#9a5700; --bad:#b3261e;
  --hero-a:#2fa468; --hero-b:#0d5a33; --hero-ink:#ffffff; --hero-sub:rgba(255,255,255,.8); --hero-num:#ffffff;
  --stripe:rgba(27,122,73,.05); --glow:rgba(47,164,104,.20);
  --shadow:0 2px 0 rgba(13,90,51,.10),0 12px 22px -16px rgba(13,90,51,.55);
  --font-body:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Roboto,'Sukhumvit Set','Thonburi',sans-serif;
  --font-num:'Barlow Condensed','Arial Narrow','Noto Sans Thai',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1913; --card:#14251c; --ink:#e7f0e3; --muted:#93a89b; --line:#264034;
    --accent:#4cd08a; --on-accent:#06150d; --tint:#1b3326;
    --good:#4cd08a; --warn:#f0a04b; --bad:#ff7b72;
    --hero-a:#1f4a35; --hero-b:#10281b; --hero-ink:#e7f0e3; --hero-sub:#93a89b; --hero-num:#7ae8ad;
    --stripe:rgba(76,208,138,.045); --glow:rgba(76,208,138,.10);
    --shadow:0 2px 0 rgba(0,0,0,.30),0 12px 22px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1913; --card:#14251c; --ink:#e7f0e3; --muted:#93a89b; --line:#264034;
  --accent:#4cd08a; --on-accent:#06150d; --tint:#1b3326;
  --good:#4cd08a; --warn:#f0a04b; --bad:#ff7b72;
  --hero-a:#1f4a35; --hero-b:#10281b; --hero-ink:#e7f0e3; --hero-sub:#93a89b; --hero-num:#7ae8ad;
  --stripe:rgba(76,208,138,.045); --glow:rgba(76,208,138,.10);
  --shadow:0 2px 0 rgba(0,0,0,.30),0 12px 22px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
h1{font-size:20px;margin:0;line-height:1.25}
h2{font-size:16px;margin:0 0 8px;line-height:1.3}
p{margin:0 0 8px}
.course{margin:2px 0 0;font-size:13px;color:var(--muted)}
.muted{color:var(--muted);font-size:14px}
.mono{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.hint{border-color:var(--accent);background:var(--tint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn,.seg,.chip,nav button,summary{touch-action:manipulation}
.btn{font:inherit;font-weight:500;min-height:48px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}

var KEY='greenedge.v1';
var TOL=10; /* หลา: เกณฑ์เตือนเมื่อระยะทีถึงกลางกรีนต่างจากการ์ด */

/* ---------- ฟังก์ชันพื้นฐาน ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rad(d){return d*Math.PI/180;}
/* เมตรต่อ 1 องศา ตามทรงรี WGS84 ที่ละติจูดนั้น (แม่นกว่าทรงกลม ~0.5% ในประเทศไทย) */
function mLat(phi){var p=rad(phi);return 111132.92-559.82*Math.cos(2*p)+1.175*Math.cos(4*p);}
function mLng(phi){var p=rad(phi);return 111412.84*Math.cos(p)-93.5*Math.cos(3*p)+0.118*Math.cos(5*p);}
function dist(a,b){
  var m=(a.lat+b.lat)/2,dy=(b.lat-a.lat)*mLat(m),dx=(b.lng-a.lng)*mLng(m);
  return Math.sqrt(dx*dx+dy*dy);
}
function yd(m){return m/YD;}
function fmt(n){return Math.round(n);}
function median(a){var s=a.slice().sort(function(x,y){return x-y;}),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function validLL(lat,lng){return typeof lat==='number'&&typeof lng==='number'&&isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180;}
function parseLL(str){
  var m=String(str).match(/(-?\d{1,3}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);
  if(!m) return null;
  var lat=parseFloat(m[1]),lng=parseFloat(m[2]);
  return validLL(lat,lng)?{lat:lat,lng:lng}:null;
}
/* ค่ากลางของหลายค่า ใช้ตอนแปลงข้อมูลจากเวอร์ชันเก่าเท่านั้น */
function eff(arr){
  if(!arr||!arr.length) return null;
  return {lat:median(arr.map(function(s){return s.lat;})),lng:median(arr.map(function(s){return s.lng;})),n:arr.length};
}

/* ---------- สถานะแอป: หนึ่งหมุดทีออฟ (T) และหนึ่งหมุดกลางกรีน (C) ต่อหลุม ---------- */
function newRound(){return {id:Date.now(),date:new Date().toISOString().slice(0,10),marks:{},holes:{}};}
function cleanHoles(o){
  var out={};if(!o||typeof o!=='object') return out;
  for(var h=1;h<=18;h++){var x=o[h];
    if(x&&typeof x==='object'&&Number.isInteger(x.on)&&Number.isInteger(x.putts)&&x.on>=1&&x.on<=ON_MAX&&x.putts>=0&&x.putts<=PUTT_MAX) out[h]={on:x.on,putts:x.putts,ts:+x.ts||0};}
  return out;
}
function blankState(){return {v:2,course:'RSU Vista Golf Course',hole:1,pts:{},round:newRound(),rounds:[],sim:null,test:false,rot:true,theme:'auto',map:null};}
/* ตั้งค่าแผนที่: use = maptiler | esri | custom, คีย์เก็บแยกตามผู้ให้บริการ, maxZoom = ซูมเข้าได้สูงสุด (ภาพจริงมีรายละเอียดถึงระดับหนึ่งเท่านั้น) */
function normMap(m){
  if(!m||typeof m!=='object') return null;
  if(m.keys||m.use){return {use:m.use||'maptiler',keys:{maptiler:(m.keys&&m.keys.maptiler)||'',esri:(m.keys&&m.keys.esri)||''},url:m.url||'',maxZoom:+m.maxZoom>=15&&+m.maxZoom<=21?+m.maxZoom:18};}
  /* รูปแบบเก่า: {kind,key,url} */
  var use=m.kind==='custom'?'custom':'maptiler';
  return {use:use,keys:{maptiler:(use==='maptiler'?m.key:'')||'',esri:''},url:m.url||'',maxZoom:18};
}
function okPt(p){return !!p&&typeof p==='object'&&!Array.isArray(p)&&validLL(p.lat,p.lng)&&p.src!=='demo';}
function cleanPt(p){return {lat:p.lat,lng:p.lng,src:p.src||'map',acc:p.acc||0,ts:p.ts||0};}
/* รับได้ทั้งรูปแบบใหม่ (T,C เป็นหมุดเดียว) และเก่า (F,B,T เป็นรายการค่า): กลางกรีนเก่า = กึ่งกลางขอบหน้า-หลัง */
function migratePts(old){
  var out={};
  Object.keys(old||{}).forEach(function(h){
    var hn=+h;if(!(hn>=1&&hn<=18)) return;
    var o=old[h]||{},res={},e,f,b;
    if(Array.isArray(o.T)){e=eff(o.T.filter(okPt));if(e) res.T=cleanPt({lat:e.lat,lng:e.lng,src:'map'});}
    else if(okPt(o.T)) res.T=cleanPt(o.T);
    if(okPt(o.C)) res.C=cleanPt(o.C);
    else if(Array.isArray(o.F)&&Array.isArray(o.B)){
      f=eff(o.F.filter(okPt));b=eff(o.B.filter(okPt));
      if(f&&b) res.C=cleanPt({lat:(f.lat+b.lat)/2,lng:(f.lng+b.lng)/2,src:'map'});
    }
    if(o.B&&!Array.isArray(o.B)&&okPt(o.B)) res.B=cleanPt(o.B); /* B เก่า (ขอบหลังกรีน) เป็นรายการ จึงไม่ถูกนับเป็นจุดหัก */
    if(res.T||res.C||res.B) out[hn]=res;
  });
  return out;
}
function load(){
  try{
    var t=localStorage.getItem(KEY);if(!t) return null;
    var o=JSON.parse(t);if(!o||typeof o!=='object'||!o.pts||!o.round) return null;
    var s=blankState();
    s.hole=(o.hole>=1&&o.hole<=18)?o.hole:1;
    s.rot=o.rot!==false;
    s.theme=(o.theme==='light'||o.theme==='dark')?o.theme:'auto';
    s.map=normMap(o.map); /* โหมดทดสอบไม่ถูกเก็บข้ามการเปิดแอป ตั้งใจให้ปิดทุกครั้งที่เปิดใหม่ */
    if(o.v===1&&o.demo) return s; /* ข้อมูลตัวอย่างจำลองจากเวอร์ชันแรก ทิ้งทั้งหมด */
    s.pts=migratePts(o.pts);
    s.round=o.round;if(!s.round.marks) s.round.marks={};s.round.holes=cleanHoles(s.round.holes);
    s.rounds=(Array.isArray(o.rounds)?o.rounds:[]).filter(function(r){return r&&typeof r==='object'&&r.marks;}).map(function(r){r.holes=cleanHoles(r.holes);return r;});
    return s;
  }catch(e){return null;}
}
var S=load()||blankState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;}catch(e){storageOk=false;}}
function resetKeep(){var m=S.map,th=S.theme,rt=S.rot;S=blankState();S.map=m;S.theme=th;S.rot=rt;}
/* ลูกกอล์ฟยิ้มข้างธง (ตัวละครของเราเอง) ใช้ในหัวแอพ หน้าว่าง และรูปสกอร์ */

}
/* ธีมสี: auto = ตามเครื่อง (ไม่ตั้ง data-theme ให้ CSS ใช้ prefers-color-scheme) / light / dark สีเดิมทุกโหมด */
function effTheme(){return (S.theme==='light'||S.theme==='dark')?S.theme:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');}
function applyTheme(){
  var r=document.documentElement;
  if(S.theme==='light'||S.theme==='dark') r.setAttribute('data-theme',S.theme); else r.removeAttribute('data-theme');
  var m=document.getElementById('themecolor');if(m) m.setAttribute('content',effTheme()==='dark'?'#0d1913':'#1b7a49');
}
try{var __mq=window.matchMedia('(prefers-color-scheme: dark)'),__cb=function(){if(S.theme!=='light'&&S.theme!=='dark') applyTheme();};if(__mq.addEventListener) __mq.addEventListener('change',__cb); else if(__mq.addListener) __mq.addListener(__cb);}catch(e){}
function holeGeo(h){var o=S.pts[h]||{};return {T:o.T||null,B:o.B||null,C:o.C||null};}
function setPt(h,k,p){(S.pts[h]||(S.pts[h]={}))[k]=p;save();}
function delPt(h,k){var o=S.pts[h];if(o){delete o[k];if(!o.T&&!o.C&&!o.B) delete S.pts[h];}save();}
/* ระยะตามแนวหลุมแบบการ์ด (เมตร): ที→จุดหัก→กลางกรีน ถ้าไม่มีจุดหักก็ที→กลางกรีน */
function holeLenM(g){return (g.T&&g.C)?(g.B?dist(g.T,g.B)+dist(g.B,g.C):dist(g.T,g.C)):null;}
/* ผ่านจุดหักแล้วหรือยัง: อยู่เลยเส้นตั้งฉากกับทิศทีออฟ→จุดหักที่จุดหักไปทางกรีน */
function passedPivot(pos,g){
  var kx=mLng(g.B.lat),ky=mLat(g.B.lat);
  return ((pos.lng-g.B.lng)*kx)*((g.B.lng-g.T.lng)*kx)+((pos.lat-g.B.lat)*ky)*((g.B.lat-g.T.lat)*ky)>=0;
}
function advanceTarget(){var g=holeGeo(S.hole);if(surveyTarget==='T') surveyTarget='C'; else if(surveyTarget==='B'&&!g.C) surveyTarget='C';}
function hasData(){
  if(Object.keys(S.pts).length) return true;
  for(var m in S.round.marks){if(S.round.marks[m].length) return true;}
  if(Object.keys(S.round.holes).length) return true;
  return S.rounds.length>0;
}

/* ---------- GPS ---------- */
var watchId=null,fix=null,gpsErr=null,wl=null;
function getPos(){
  if(S.test&&S.sim) return {lat:S.sim.lat,lng:S.sim.lng,acc:S.sim.acc,sim:true};
  if(fix&&Date.now()-fix.ts<30000) return fix;
  return null;
}
function lockScreen(){try{if('wakeLock' in navigator){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){});}}catch(e){}}
function startGPS(){
  if(watchId!==null) return;
  if(!('geolocation' in navigator)){gpsErr={code:0,msg:'เบราว์เซอร์นี้ไม่รองรับ GPS'};updateLive();return;}
  S.sim=null;S.test=false;save();gpsErr=null;
  try{
    watchId=navigator.geolocation.watchPosition(onFix,onGeoErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  }catch(e){gpsErr={code:1,msg:String(e&&e.message||e)};watchId=null;}
  lockScreen();
  updateLive();
}
function stopGPS(){
  if(watchId!==null){try{navigator.geolocation.clearWatch(watchId);}catch(e){}}
  watchId=null;fix=null;
  try{if(wl){wl.release();}}catch(e){}
  updateLive();
}
function onFix(p){
  gpsErr=null;
  fix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||99,ts:Date.now()};
  updateLive();
}
function onGeoErr(e){
  gpsErr={code:e.code,msg:e.message};
  if(e.code===1){stopGPS();}
  updateLive();
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&watchId!==null) lockScreen();});
function gpsStatus(){
  if(S.test) return {cls:'warn',txt:'โหมดทดสอบ'};
  if(watchId===null) return gpsErr&&gpsErr.code===1?{cls:'bad',txt:'GPS ถูกบล็อก'}:{cls:'',txt:'GPS ปิด'};
  if(!fix) return {cls:'warn',txt:'กำลังหาสัญญาณ…'};
  if(Date.now()-fix.ts>10000) return {cls:'bad',txt:'สัญญาณหาย'};
  var a=Math.round(fix.acc);
  if(fix.acc<=6) return {cls:'good',txt:'สัญญาณดี ±'+a+' ม.'};
  if(fix.acc<=12) return {cls:'warn',txt:'พอใช้ ±'+a+' ม.'};
  return {cls:'bad',txt:'อ่อน ±'+a+' ม.'};
}
function gpsErrMsg(){
  if(!gpsErr) return '';
  if(gpsErr.code===1) return inFrame?'หน้านี้เปิดอยู่ในกรอบของเว็บอื่น ซึ่งบล็อกตำแหน่ง ให้เปิดไฟล์ที่โฮสต์เองแบบเต็มหน้า หรือลองด้วยโหมดทดสอบในแท็บข้อมูล':'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง เปิดสิทธิ์ตำแหน่งของเบราว์เซอร์ในการตั้งค่าเครื่อง แล้วกดเริ่ม GPS ใหม่';
  if(gpsErr.code===2) return 'หาตำแหน่งไม่ได้ตอนนี้ ลองย้ายไปที่โล่ง';
  if(gpsErr.code===3) return 'รอสัญญาณนานเกินไป กำลังลองต่อ';
  return gpsErr.msg||'GPS มีปัญหา';
}

var tab='play',confirmClear=false,surveyTarget='T',lastPin=null,pasteOpen=false;
var lastHTML={};
function setHTML(id,html){var el=$(id);if(!el||lastHTML[id]===html)return;el.innerHTML=html;lastHTML[id]=html;}
function toast(msg){var t=$('toast');t.textContent=msg;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className='';},3800);}
function pickTarget(){var g=holeGeo(S.hole);surveyTarget=!g.T?'T':(!g.C?'C':surveyTarget);}
/* โหมดทดสอบ: ตำแหน่งจำลองแทน GPS ลากจุดน้ำเงินบนแผนที่แท็บวัดระยะได้ ตั้งต้นที่ 60% ของทางจากทีไปกลางกรีน (เหมือนหลังตีไดรฟ์) */
function defaultSim(){
  var g=holeGeo(S.hole);
  if(g.T&&g.C) return {lat:g.T.lat+(g.C.lat-g.T.lat)*0.6,lng:g.T.lng+(g.C.lng-g.T.lng)*0.6,acc:3};
  if(g.C) return {lat:g.C.lat-150*YD/mLat(g.C.lat),lng:g.C.lng,acc:3};
  if(map){var c=map.getCenter();return {lat:c.lat,lng:c.lng,acc:3};}
  return {lat:DEFAULT_CENTER[0],lng:DEFAULT_CENTER[1],acc:3};
}
function setTest(on){
  if(on){stopGPS();S.test=true;if(!S.sim) S.sim=defaultSim();}
  else{S.test=false;S.sim=null;}
  save();render();
}
function testBoxHTML(){
  if(!S.test||!S.sim) return '';
  var g=holeGeo(S.hole),p=S.sim,d=g.C?fmt(yd(dist(p,g.C))):null;
  return '<div class="card test"><div class="row spread"><b>โหมดทดสอบ (ไม่ใช่ GPS จริง)</b><button class="btn small" data-act="simReset">วางกลางทาง</button></div>'+
    '<p class="muted" style="margin:4px 0">'+(mapAvailable()?'ลากจุดน้ำเงินบนแผนที่เพื่อเปลี่ยนตำแหน่งของคุณ':'ใส่พิกัดจำลองในแท็บข้อมูล')+'</p>'+
    '<div class="mono" style="font-size:15px">'+p.lat.toFixed(7)+', '+p.lng.toFixed(7)+'</div>'+
    '<div>ถึงกลางกรีน <b>'+(d===null?'–':d)+'</b> หลา</div></div>';
}

function holeBar(){
  var n=S.hole,chips='';
  for(var h=1;h<=18;h++){

    '<button class="btn" data-act="next" aria-label="หลุมถัดไป">›</button></div>'+
    '<div class="chips" role="group" aria-label="เลือกหลุม">'+chips+'</div>';
}

/* ---- จบหลุม: กดปุ่ม +/− จดออนกับพัต แล้วค่อยบันทึก (สกอร์ = ออน + พัต) ---- */
function scoreName(sc,par){
  if(sc===1) return 'โฮลอินวัน';
  var d=sc-par;
  return d<=-3?'อัลบาทรอส':d===-2?'อีเกิล':d===-1?'เบอร์ดี้':d===0?'พาร์':d===1?'โบกี้':d===2?'ดับเบิลโบกี้':d===3?'ทริปเปิลโบกี้':'เกินพาร์ '+d;
}
function vsTxt(v){return v>0?'+'+v:String(v);}
function scCls(sc,par){var d=sc-par;return (sc===1||d<=-1)?'sc-bird':d===0?'sc-par':d===1?'sc-bog':'sc-dbl';}
var fin=null; /* ร่างผลของหลุมที่เปิดอยู่ {h,on,putts,edit} */
function finState(){
  var r=S.round.holes[S.hole];
  if(!fin||fin.h!==S.hole){
    var par=PAR[S.hole-1];
    fin=r?{h:S.hole,on:r.on,putts:r.putts,edit:false}:{h:S.hole,on:Math.max(1,par-2),putts:2,edit:true}; /* ค่าเริ่มต้น = ตามกติกา (GIR + 2 พัต) แก้ได้ด้วยปุ่ม */
  }
  return fin;
}
function stepRow(label,sub,f,val,act,idp){
  act=act||'finStep';idp=idp||'fin';

/* วาดแผนผังหลุมเป็น SVG หัวขึ้นคือทิศไปกรีน ใช้ทั้งแท็บวัดระยะ (ไม่มีภาพดาวเทียม) และแท็บประวัติ (ย้อนดูช็อต) */
function planSVG(n,marks,pos,opt){
  var g=holeGeo(n);
  var near=(pos&&dist(pos,g.C)<900)?pos:null;
  var kx=mLng(g.C.lat),ky=mLat(g.C.lat);
  function xy(p){return {x:(p.lng-g.C.lng)*kx,y:(p.lat-g.C.lat)*ky};}
  var from=g.T||near||marks[0]||null,a=0;
  if(from){var v=xy(from);a=Math.atan2(-v.x,-v.y);}
  var ca=Math.cos(a),sa=Math.sin(a);
  function rot(p){var q=xy(p);return {x:q.x*ca-q.y*sa,y:q.x*sa+q.y*ca};}
  var items=[];
  function add(k,p,i){if(p){var r=rot(p);r.k=k;r.i=i;items.push(r);}}
  add('T',g.T);add('B',g.B);add('C',g.C);
  marks.forEach(function(m,i){add('M',m,i);});
  if(near) add('P',near);
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  items.forEach(function(o){minx=Math.min(minx,o.x);maxx=Math.max(maxx,o.x);miny=Math.min(miny,o.y);maxy=Math.max(maxy,o.y);});
  var W=320,H=280,pad=30;
  var spanX=Math.max(maxx-minx,50),spanY=Math.max(maxy-miny,50);
  var sc=Math.min((W-2*pad)/spanX,(H-2*pad)/spanY),cx=(minx+maxx)/2,cy=(miny+maxy)/2;
  function X(o){return (W/2+(o.x-cx)*sc).toFixed(1);}
  function Y(o){return (H/2-(o.y-cy)*sc).toFixed(1);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="แผนผังหลุม '+n+'">';
  var ms=items.filter(function(o){return o.k==='M';});
  if(ms.length>1) s+='<polyline class="path" points="'+ms.map(function(o){return X(o)+','+Y(o);}).join(' ')+'"/>';
  var cI=items.filter(function(o){return o.k==='C';})[0],pI=items.filter(function(o){return o.k==='P';})[0];
  var tI=items.filter(function(o){return o.k==='T';})[0],bI=items.filter(function(o){return o.k==='B';})[0];
  if(tI&&bI&&cI) s+='<polyline class="course" points="'+[tI,bI,cI].map(function(o){return X(o)+','+Y(o);}).join(' ')+'"/>';
  if(cI&&pI){
    s+='<line class="aim" x1="'+X(pI)+'" y1="'+Y(pI)+'" x2="'+X(cI)+'" y2="'+Y(cI)+'"/>';
    s+='<text x="'+((+X(pI)+ +X(cI))/2+6).toFixed(1)+'" y="'+((+Y(pI)+ +Y(cI))/2).toFixed(1)+'">'+fmt(yd(dist(pos,g.C)))+'</text>';
  }
  items.forEach(function(o){
    var x=X(o),y=Y(o);
    if(o.k==='T') s+='<rect class="pt" x="'+(x-5)+'" y="'+(y-5)+'" width="10" height="10"/><text x="'+(+x+9)+'" y="'+(+y+4)+'">ที</text>';
    else if(o.k==='C') s+='<circle class="pt" cx="'+x+'" cy="'+y+'" r="5"/><text x="'+(+x+9)+'" y="'+(+y+4)+'">กลางกรีน</text>';
    else if(o.k==='B') s+='<circle class="pt b" cx="'+x+'" cy="'+y+'" r="4.5"/><text x="'+(+x+9)+'" y="'+(+y+4)+'">จุดหัก</text>';
    else if(o.k==='M'&&o.i>0) s+='<circle class="mk" cx="'+x+'" cy="'+y+'" r="'+(opt&&opt.num?7:5)+'"/>'+(opt&&opt.num?'<text class="mkn" x="'+x+'" y="'+(+y+3.2)+'">'+o.i+'</text>':'');
    else if(o.k==='P') s+='<circle class="me" cx="'+x+'" cy="'+y+'" r="7"/>';
  });
  s+='</svg>';
  return {svg:s,near:near};
}

function allRounds(){return [S.round].concat(S.rounds.slice().reverse());}

function roundStats(r){
  var hs=r.holes||{},o={n:0,par:0,on:0,score:0,putts:0,vs:0,gir:0,p3:0,shots:0},h;
  for(h=1;h<=18;h++){var x=hs[h];if(x){var par=PAR[h-1],sc=x.on+x.putts;o.n++;o.par+=par;o.on+=x.on;o.score+=sc;o.putts+=x.putts;o.vs+=sc-par;if(x.on<=par-2) o.gir++;if(x.putts>=3) o.p3++;}}
  for(var m in (r.marks||{})) o.shots+=Math.max(0,r.marks[m].length-1);
  return o;
}
function halfStats(r,a,b){

}

/* สัญลักษณ์สกอร์การ์ดแบบกอล์ฟ: วงกลม = ต่ำกว่าพาร์ (สองชั้น = อีเกิลขึ้นไป) สี่เหลี่ยม = เกินพาร์ (สองชั้น = ดับเบิลโบกี้ขึ้นไป) */

function issues(){
  var out=[],missT=[],missC=[],h;
  for(h=1;h<=18;h++){
    var g=holeGeo(h);
    if(!g.T) missT.push(h);
    if(!g.C) missC.push(h);
    if(g.T&&g.C){
      var td=yd(holeLenM(g)),cd=CARD[h-1];
      if(Math.abs(td-cd)>TOL) out.push('หลุม '+h+': '+(g.B?'ทีออฟ→จุดหัก→กลางกรีน ':'ทีออฟถึงกลางกรีน ')+fmt(td)+' หลา การ์ด '+cd+' (ต่าง '+(td-cd>0?'+':'')+fmt(td-cd)+')');
    }
  }
  return {out:out,missT:missT,missC:missC};
}
function clubStats(){
  var all=S.rounds.concat([S.round]),by={};
  all.forEach(function(r){
    for(var h in r.marks){
      var ms=r.marks[h];
      for(var i=0;i<ms.length-1;i++){
        var c=ms[i].club;if(!c) continue;
        (by[c]||(by[c]=[])).push(yd(dist(ms[i],ms[i+1])));
      }
    }
  });
  return CLUBS.filter(function(c){return by[c];}).map(function(c){
    var a=by[c];return {c:c,n:a.length,avg:a.reduce(function(x,y){return x+y;},0)/a.length,max:Math.max.apply(null,a)};
  });
}

var map=null,mapEl=null,mapWrap=null,zb=null,attEl=null,northEl=null,simMk=null,simDrag=false,simGrab=null,tileLayer=null,tileKey='',tileErr=0,gStatic=null,gPlayer=null,mapHole=0,mapTab='',lastPlayerKey='',rotAngle=null,rotBearing=0;
var DEFAULT_CENTER=[13.975,100.59]; /* ประมาณย่านลำลูกกา ปทุมธานี */
function validTileUrl(u){return /^https:\/\//.test(u||'')&&/\{z\}/.test(u)&&/\{x\}/.test(u)&&/\{y\}/.test(u);}
function zoomCap(){var z=S.map&&+S.map.maxZoom;return (z>=15&&z<=21)?z:18;}
function tileCfg(){
  var m=S.map;if(!m) return null;

  if(m.use==='custom') return validTileUrl(m.url)?{url:m.url,att:'ภาพจากผู้ให้บริการที่ตั้งค่าเอง'}:null;
  if(m.use==='esri') return k.esri?{url:'https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token='+encodeURIComponent(k.esri),att:'Esri, Maxar, Earthstar Geographics, and the GIS User Community'}:null;

}

/* หมุดเล็กและบางเพื่อไม่บังจุดที่ปัก: ทีออฟ = จัตุรัสเหลืองเล็ก (จุดจริงอยู่ตรงกลาง) กลางกรีน = ธงเล็ก (จุดจริงอยู่ที่โคนเสา) */
var FLAG='<svg viewBox="0 0 28 30" width="28" height="30" aria-hidden="true"><path d="M6 26V4" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><path d="M6 26V4" stroke="#12271d" stroke-width="1.4" stroke-linecap="round"/><path d="M6 4l13 5L6 14z" fill="#1fae63" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><circle cx="6" cy="26" r="2.6" fill="#1fae63" stroke="#fff" stroke-width="1.4"/></svg>';
function pinIcon(k,sel){
  if(k==='T') return L.divIcon({className:'pin t'+(sel?' sel':''),html:'<i></i>',iconSize:[24,24],iconAnchor:[12,12]});
  if(k==='B') return L.divIcon({className:'pin b'+(sel?' sel':''),html:'<i></i>',iconSize:[24,24],iconAnchor:[12,12]});
  return L.divIcon({className:'pin c'+(sel?' sel':''),html:FLAG,iconSize:[28,30],iconAnchor:[6,26]});
}
/* โหมดหมุน: แท็บวัดระยะ + มีทีออฟและกลางกรีนครบ + เปิดตัวเลือกไว้ → หมุนแผนที่ให้ทิศทีออฟไปกรีนชี้ขึ้นบนจอ
   หมุนด้วย CSS ทั้งกล่อง Leaflet (ขยายเป็นสี่เหลี่ยมจัตุรัสใหญ่พอให้ไม่เห็นมุมว่าง) แล้วปิดการลาก/ซูมด้วยนิ้วของ Leaflet
   เพราะนิ้วจะไปคนละทิศกับแผนที่ที่หมุน ใช้ปุ่ม + − ของเราแทน */
function calcRot(){
  rotAngle=null;
  if(tab!=='play'||S.rot===false) return;
  var g=holeGeo(S.hole);if(!g.T||!g.C) return;
  var m=(g.T.lat+g.C.lat)/2,dn=(g.C.lat-g.T.lat)*mLat(m),de=(g.C.lng-g.T.lng)*mLng(m);
  if(Math.sqrt(dn*dn+de*de)<20) return; /* ทีออฟกับกรีนใกล้กันเกินไป ทิศไม่น่าเชื่อถือ */
  rotBearing=Math.atan2(de,dn);        /* ทิศเข็มทิศจากทีออฟไปกรีน (เรเดียน ตามเข็มจากทิศเหนือ) */
  rotAngle=-rotBearing*180/Math.PI;    /* หมุนทวนเข็มเท่าทิศนั้น ทิศนั้นจึงชี้ขึ้นบนจอ */
}
function layoutMap(){
  if(!map||!mapWrap) return;
  var W=mapWrap.clientWidth,H=mapWrap.clientHeight,r=rotAngle!==null;
  mapWrap.classList.toggle('rotmap',r);
  if(r&&W>0&&H>0){
    var D=Math.ceil(Math.sqrt(W*W+H*H))+2;
    mapEl.style.width=D+'px';mapEl.style.height=D+'px';
    mapEl.style.left=((W-D)/2)+'px';mapEl.style.top=((H-D)/2)+'px';
    mapEl.style.transform='rotate('+rotAngle+'deg)';
    mapEl.style.setProperty('--ca',(-rotAngle)+'deg');
    if(northEl) northEl.style.transform='rotate('+rotAngle+'deg)';
  }else{
    ['width','height','left','top','transform'].forEach(function(k){mapEl.style[k]='';});
    mapEl.style.removeProperty('--ca');
    if(northEl) northEl.style.transform='';
    if(r) mapWrap.classList.remove('rotmap');
  }
  map.invalidateSize({animate:false});
}
function applyInteraction(){
  var r=mapWrap.classList.contains('rotmap');
  ['touchZoom','doubleClickZoom','scrollWheelZoom','boxZoom','keyboard'].forEach(function(h){if(map[h]){if(r) map[h].disable(); else map[h].enable();}});
  try{
    if(r) map.dragging.disable();
    else if(L.Browser.mobile&&tab!=='survey') map.dragging.disable(); /* มือถือ: หน้าวัดระยะให้นิ้วเลื่อนหน้าได้ */
    else map.dragging.enable();
  }catch(e){}
}
function mountMap(){
  if(tab!=='play'&&tab!=='survey') return;
  var slot=$('mapslot');if(!slot||!mapAvailable()) return;
  if(!mapWrap){
    mapWrap=document.createElement('div');mapWrap.className='mapbox'; /* กรอบนอก (คลาส mapbox) กับกล่อง Leaflet ข้างใน (mapin) แยกกัน เพื่อให้หมุนเฉพาะแผนที่ได้ ห้ามเขียน className ทับกล่อง Leaflet */
    mapEl=document.createElement('div');mapEl.className='mapin';mapWrap.appendChild(mapEl);
    zb=document.createElement('div');zb.className='zbadge';mapWrap.appendChild(zb);
    var zc=document.createElement('div');zc.className='zctl';
    zc.innerHTML='<button type="button" data-act="mapZoomIn" aria-label="ซูมเข้า">+</button><button type="button" data-act="mapZoomOut" aria-label="ซูมออก">&minus;</button>';
    mapWrap.appendChild(zc);
    attEl=document.createElement('div');attEl.className='att';mapWrap.appendChild(attEl);
    northEl=document.createElement('div');northEl.className='north';northEl.setAttribute('aria-hidden','true');
    northEl.innerHTML='<svg viewBox="0 0 30 30"><path d="M15 4l5 11H10z" fill="#d23b2e"/><path d="M15 26l-5-11h10z" fill="#8a8f8c"/><circle cx="15" cy="15" r="1.6" fill="#fff"/></svg>';
    mapWrap.appendChild(northEl);
  }
  mapWrap.classList.toggle('tall',tab==='survey');
  slot.appendChild(mapWrap);
  if(!map){
    /* zoomSnap 1: ใช้ tile ระดับเต็มเสมอ ไม่ขยายครึ่งระดับซึ่งทำให้เบลอ */
    map=L.map(mapEl,{zoomControl:true,maxZoom:zoomCap(),zoomSnap:1}).setView(DEFAULT_CENTER,14);
    gStatic=L.layerGroup().addTo(map);gPlayer=L.layerGroup().addTo(map);
    map.on('click',onMapClick);
    map.on('zoomend',function(){zb.textContent='ซูม '+map.getZoom();});
  }
  var cfg=tileCfg(),tk=cfg.url+'|'+zoomCap();
  if(tileKey!==tk){
    if(tileLayer) map.removeLayer(tileLayer);
    tileErr=0;
    /* ไม่ขยายภาพเกินระดับที่ตั้งไว้ เพราะเกินจากนี้ได้แค่พิกเซลเดิมที่ถูกขยาย */
    map.setMaxZoom(zoomCap());
    tileLayer=L.tileLayer(cfg.url,{maxZoom:zoomCap(),maxNativeZoom:zoomCap(),attribution:cfg.att}).addTo(map);
    tileLayer.on('tileerror',function(){tileErr++;if(tileErr===4) toast('โหลดภาพดาวเทียมไม่ได้ ตรวจคีย์แผนที่และอินเทอร์เน็ต');});

function pointerLatLng(cx,cy){
  var r=mapEl.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);
  var a=-(rotAngle||0)*Math.PI/180,c=Math.cos(a),sn=Math.sin(a),sz=map.getSize();

function syncSimMarker(){

    simMk=L.marker([S.sim.lat,S.sim.lng],{icon:L.divIcon({className:'simpin',html:'<i></i>',iconSize:[32,32],iconAnchor:[16,16]}),draggable:false,keyboard:false,autoPan:false,zIndexOffset:1000}).addTo(map);

      var ll=pointerLatLng(e.clientX,e.clientY);
      simGrab={lat:S.sim.lat-ll.lat,lng:S.sim.lng-ll.lng}; /* จับตรงไหนของจุดก็ได้ จุดไม่กระโดด */

function fitRot(){
  var g=holeGeo(S.hole),marks=S.round.marks[S.hole]||[],pos=getPos(),pts=[g.T,g.C].concat(g.B?[g.B]:[],marks);
  if(pos&&dist(pos,g.T)<900) pts.push(pos);
  var lat0=g.T.lat,lng0=g.T.lng,kn=mLat(lat0),ke=mLng(lat0),th=rotBearing;
  var un=Math.cos(th),ue=Math.sin(th),vn=-Math.sin(th),ve=Math.cos(th);
  var a0=1e9,a1=-1e9,c0=1e9,c1=-1e9;
  pts.forEach(function(p){var n=(p.lat-lat0)*kn,e=(p.lng-lng0)*ke,a=n*un+e*ue,c=n*vn+e*ve;a0=Math.min(a0,a);a1=Math.max(a1,a);c0=Math.min(c0,c);c1=Math.max(c1,c);});
  var W=mapWrap.clientWidth,H=mapWrap.clientHeight,pad=36;
  var mpp=Math.max(Math.max(a1-a0,30)/Math.max(H-2*pad,50),Math.max(c1-c0,30)/Math.max(W-2*pad,50));
  var z=Math.floor(Math.log(156543.03392*Math.cos(lat0*Math.PI/180)/mpp)/Math.LN2);
  z=Math.max(12,Math.min(z,Math.min(19,zoomCap())));
  var am=(a0+a1)/2,cm=(c0+c1)/2,n=am*un+cm*vn,e=am*ue+cm*ve;
  map.setView([lat0+n/kn,lng0+e/ke],z,{animate:false});
}
function fitView(pts){
  var pos=getPos();
  if(tab==='play'&&pos&&pts.length&&dist(pos,{lat:pts[0][0],lng:pts[0][1]})<900) pts.push([pos.lat,pos.lng]);
  if(pts.length>1){map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:Math.min(19,zoomCap()),animate:false});return;}
  if(pts.length===1){map.setView(pts[0],Math.min(18,zoomCap()),{animate:false});return;}
  /* หลุมนี้ยังไม่มีหมุด: ไปที่หมุดของหลุมใกล้เคียง (หลุมก่อนหน้าก่อน) ไม่เช่นนั้นไปที่ตำแหน่งคุณ */
  for(var d=1;d<=9;d++){
    var cand=[((S.hole-d-1+18)%18)+1,((S.hole+d-1)%18)+1];
    for(var i=0;i<2;i++){
      var o=S.pts[cand[i]];

      if(p){map.setView([p.lat,p.lng],Math.min(17,zoomCap()),{animate:false});return;}
    }

function importJSON(txt){
  var o;
  try{o=JSON.parse(txt);}catch(e){throw new Error('อ่านข้อมูลไม่ได้ ตรวจว่าคัดลอกมาครบทั้งก้อน');}
  if(!o||o.app!=='greenedge'||!o.pts||typeof o.pts!=='object') throw new Error('ไม่ใช่ข้อมูลสำรองของแอปนี้');
  var inc=migratePts(o.pts),added=0;
  Object.keys(inc).forEach(function(h){
    ['T','B','C'].forEach(function(k){
      if(inc[h][k]&&!(S.pts[h]&&S.pts[h][k])){(S.pts[h]||(S.pts[h]={}))[k]=inc[h][k];added++;}
    });
  });
  var have={};have[S.round.id]=1;S.rounds.forEach(function(r){have[r.id]=1;});
  (o.rounds||[]).forEach(function(r){
    if(!r||!r.marks||have[r.id]) return;
    var clean={id:r.id,date:r.date||'',marks:{},holes:cleanHoles(r.holes)};
    Object.keys(r.marks).forEach(function(h){
      if(!Array.isArray(r.marks[h])) return;
      var ms=r.marks[h].filter(function(m){return m&&validLL(m.lat,m.lng);}).map(function(m){return {lat:m.lat,lng:m.lng,acc:m.acc||0,ts:m.ts||0,club:m.club||undefined};});
      if(ms.length) clean.marks[h]=ms;
    });
    S.rounds.push(clean);have[r.id]=1;
  });
  save();
  return added;
}

    S.round=newRound();save();toast('เริ่มรอบใหม่แล้ว');render();
  },
  askClear:function(){confirmClear=true;render();},
  cancelClear:function(){confirmClear=false;render();},
  doClear:function(){resetKeep();confirmClear=false;lastPin=null;surveyTarget='T';save();toast('ล้างข้อมูลแล้ว');render();},
  saveMap:function(){
    var use=$('mapuse').value,kM=($('mapkey-maptiler').value||'').trim(),kE=($('mapkey-esri').value||'').trim(),url=($('mapurl').value||'').trim(),z=+$('mapzoom').value;
    if(use==='maptiler'&&!kM){toast('ใส่คีย์ MapTiler ก่อน');return;}
    if(use==='esri'&&!kE){toast('ใส่คีย์ Esri ก่อน');return;}
    if(use==='custom'&&!validTileUrl(url)){toast('URL ต้องขึ้นต้นด้วย https:// และมี {z} {x} {y}');return;}
    S.map={use:use,keys:{maptiler:kM,esri:kE},url:url,maxZoom:z};
    save();loadLeaflet();toast('บันทึกการตั้งค่าแผนที่แล้ว');render();
  },
  delMap:function(){S.map=null;save();toast('ลบการตั้งค่าแผนที่แล้ว');render();}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t) return;
  var f=A[t.dataset.act];if(f) f(t);
});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='pastebox') pasteOpen=e.target.open;},true);
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.club){
    var i=+t.dataset.club,ms=S.round.marks[S.hole];
    if(ms&&ms[i-1]){ms[i-1].club=t.value||undefined;save();}
  }
});

window.__greenedge={dist:dist,eff:eff,parseLL:parseLL,yd:yd,median:median,state:function(){return S;},map:function(){return map;},mapAvailable:mapAvailable,card:CARD};
applyTheme();$('heroart').innerHTML=mascotSVG();pickTarget();save();render();loadLeaflet();
})();
</script>
